<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPSA Recap Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e17;
    --surface: #131825;
    --surface-hover: #1a2035;
    --border: #1e2a42;
    --accent: #00d4aa;
    --accent-dim: #00d4aa22;
    --danger: #ff4757;
    --danger-dim: #ff475722;
    --warning: #ffa502;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --correct: #00d4aa;
    --incorrect: #ff4757;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem;
  }

  .container { max-width: 800px; margin: 0 auto; }

  .header {
    text-align: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    color: var(--accent);
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }

  .header p { color: var(--text-dim); font-size: 0.9rem; }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 2rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .question-counter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 0.75rem;
  }

  .section-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 0.2rem 0.6rem;
    border-radius: 3px;
    margin-bottom: 1rem;
  }

  .question-text {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 1.5rem;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .option {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
  }

  .option:hover:not(.disabled) { background: var(--surface-hover); border-color: var(--accent); }
  .option.selected { border-color: var(--accent); background: var(--accent-dim); }
  .option.correct { border-color: var(--correct); background: rgba(0, 212, 170, 0.1); }
  .option.incorrect { border-color: var(--incorrect); background: rgba(255, 71, 87, 0.1); }
  .option.disabled { cursor: default; opacity: 0.6; }
  .option.disabled.correct { opacity: 1; }

  .option-letter {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.8rem;
    min-width: 1.5rem;
    height: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    background: var(--border);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option.correct .option-letter { background: var(--correct); color: var(--bg); }
  .option.incorrect .option-letter { background: var(--incorrect); color: var(--bg); }

  .explanation {
    background: var(--surface);
    border-left: 3px solid var(--accent);
    padding: 1rem 1.25rem;
    border-radius: 0 8px 8px 0;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-dim);
    display: none;
  }

  .explanation.show { display: block; }

  .btn {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--surface-hover); }

  .actions { display: flex; gap: 1rem; justify-content: flex-end; }

  .results { text-align: center; padding: 3rem 1rem; }

  .results h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
  }

  .score-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 4rem;
    font-weight: 700;
    color: var(--accent);
    margin: 1.5rem 0;
  }

  .score-display.low { color: var(--danger); }
  .score-display.mid { color: var(--warning); }
  .results p { color: var(--text-dim); margin-bottom: 2rem; font-size: 1rem; }

  .section-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.75rem;
    margin: 2rem 0;
    text-align: center;
  }

  .section-score {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }

  .section-score .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }

  .section-score .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
  }

  .start-screen { text-align: center; padding: 3rem 1rem; }

  .start-screen h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    margin-bottom: 1rem;
  }

  .start-screen p { color: var(--text-dim); margin-bottom: 0.5rem; }

  .mode-select {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }

  .mode-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    min-width: 180px;
  }

  .mode-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
  .mode-btn .title { font-weight: 600; margin-bottom: 0.25rem; }
  .mode-btn .desc { font-size: 0.8rem; color: var(--text-dim); }

  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .error {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--danger);
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>CPSA // Recap Quiz</h1>
    <p>Core Technical Skills</p>
  </div>
  <div id="app"><div class="loading">Loading questions...</div></div>
</div>

<script>
const QUESTIONS_URL = 'cpsa_b_questions_v1.json';
const STORAGE_KEY = 'cpsa_b_recap_quiz_v1';

let questions = [];
let currentQuestion = 0;
let answers = [];
let selectedOption = null;
let answered = false;
let mode = 'all';
let filteredQuestions = [];

async function loadQuestions() {
  try {
    const res = await fetch(QUESTIONS_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    questions = await res.json();
    init();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="error">
        <p>Failed to load questions.</p>
        <p style="font-size:0.8rem; margin-top:0.5rem;">${e.message}</p>
        <button class="btn btn-secondary" style="margin-top:1.5rem;" onclick="loadQuestions()">Retry</button>
      </div>`;
  }
}

function init() {
  if (loadState()) {
    if (currentQuestion >= filteredQuestions.length) {
      clearState();
      renderStart();
    } else if (answered) {
      renderQuestion();
      const q = filteredQuestions[currentQuestion];
      document.querySelectorAll('.option').forEach((el, i) => {
        el.classList.add('disabled');
        if (i === q.correct) el.classList.add('correct');
        if (i === selectedOption && selectedOption !== q.correct) el.classList.add('incorrect');
      });
      document.getElementById('explanation').classList.add('show');
      const btn = document.getElementById('submit-btn');
      btn.disabled = false;
      btn.textContent = currentQuestion < filteredQuestions.length - 1 ? 'Next Question' : 'See Results';
    } else {
      renderQuestion();
      if (selectedOption !== null) {
        document.querySelectorAll('.option').forEach((el, i) => {
          el.classList.toggle('selected', i === selectedOption);
        });
        document.getElementById('submit-btn').disabled = false;
      }
    }
  } else {
    renderStart();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      mode, currentQuestion, answers, answered, selectedOption,
      filteredQuestions: filteredQuestions.map(q => questions.indexOf(q))
    }));
  } catch(e) {}
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.filteredQuestions) || s.filteredQuestions.length === 0) return false;
    mode = s.mode || 'all';
    currentQuestion = s.currentQuestion || 0;
    answers = s.answers || [];
    answered = s.answered || false;
    selectedOption = s.selectedOption !== undefined ? s.selectedOption : null;
    filteredQuestions = s.filteredQuestions.map(i => questions[i]).filter(Boolean);
    return filteredQuestions.length > 0;
  } catch(e) { return false; }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getSections() {
  return [...new Set(questions.map(q => q.section))].sort();
}

function startQuiz(section) {
  mode = section;
  if (section === 'all') {
    filteredQuestions = shuffle([...questions]);
  } else {
    filteredQuestions = shuffle(questions.filter(q => q.section === section));
  }
  currentQuestion = 0;
  answers = [];
  selectedOption = null;
  answered = false;
  clearState();
  renderQuestion();
}

function renderStart() {
  const sections = getSections();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="start-screen">
      <h2>Core Technical Skills</h2>
      <p>${questions.length} questions across ${sections.length} topic areas</p>
      <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 0.5rem;">Select a mode to begin</p>
      <div class="mode-select">
        <div class="mode-btn" onclick="startQuiz('all')">
          <div class="title">All Topics</div>
          <div class="desc">${questions.length} questions, randomised</div>
        </div>
      </div>
      <div class="mode-select" style="margin-top: 0.75rem;">
        ${sections.map(s => {
          const count = questions.filter(q => q.section === s).length;
          return `<div class="mode-btn" onclick="startQuiz('${s}')">
            <div class="title">${s}</div>
            <div class="desc">${count} question${count > 1 ? 's' : ''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderQuestion() {
  const app = document.getElementById('app');
  const q = filteredQuestions[currentQuestion];
  const progress = (currentQuestion / filteredQuestions.length) * 100;
  const letters = ['A', 'B', 'C', 'D'];

  app.innerHTML = `
    <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
    <div class="question-counter">Question ${currentQuestion + 1} of ${filteredQuestions.length}</div>
    <div class="section-tag">${q.section}</div>
    <div class="question-text">${q.q}</div>
    <div class="options">
      ${q.options.map((opt, i) => `
        <div class="option" id="opt-${i}" onclick="selectOption(${i})">
          <div class="option-letter">${letters[i]}</div>
          <div>${opt}</div>
        </div>
      `).join('')}
    </div>
    <div class="explanation" id="explanation">${q.explanation}</div>
    <div class="actions">
      <button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()" disabled>Check Answer</button>
    </div>
  `;
}

function selectOption(idx) {
  if (answered) return;
  selectedOption = idx;
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.toggle('selected', i === idx);
  });
  document.getElementById('submit-btn').disabled = false;
  saveState();
}

function submitAnswer() {
  if (answered) {
    currentQuestion++;
    selectedOption = null;
    answered = false;
    saveState();
    if (currentQuestion >= filteredQuestions.length) {
      clearState();
      renderResults();
    } else {
      renderQuestion();
    }
    return;
  }

  answered = true;
  const q = filteredQuestions[currentQuestion];
  const isCorrect = selectedOption === q.correct;
  answers.push({ section: q.section, correct: isCorrect });
  saveState();

  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.add('disabled');
    el.classList.remove('selected');
    if (i === q.correct) el.classList.add('correct');
    if (i === selectedOption && !isCorrect) el.classList.add('incorrect');
  });

  document.getElementById('explanation').classList.add('show');
  const btn = document.getElementById('submit-btn');
  btn.textContent = currentQuestion < filteredQuestions.length - 1 ? 'Next Question' : 'See Results';
}

function renderResults() {
  const app = document.getElementById('app');
  const correct = answers.filter(a => a.correct).length;
  const total = answers.length;
  const pct = Math.round((correct / total) * 100);

  const sections = getSections();
  const sectionScores = sections.map(s => {
    const sAnswers = answers.filter(a => a.section === s);
    if (sAnswers.length === 0) return null;
    const sCorrect = sAnswers.filter(a => a.correct).length;
    return { section: s, correct: sCorrect, total: sAnswers.length };
  }).filter(Boolean);

  let scoreClass = '';
  if (pct < 50) scoreClass = 'low';
  else if (pct < 75) scoreClass = 'mid';

  let message = '';
  if (pct >= 90) message = 'Excellent. Solid across the board.';
  else if (pct >= 75) message = 'Good foundation. Review the sections you dropped marks on.';
  else if (pct >= 50) message = 'Needs work. Focus on the weak areas below.';
  else message = 'Significant gaps. Revisit the material before attempting again.';

  app.innerHTML = `
    <div class="results">
      <h2>Results</h2>
      <div class="score-display ${scoreClass}">${pct}%</div>
      <p>${correct}/${total} correct - ${message}</p>
      <div class="section-breakdown">
        ${sectionScores.map(s => `
          <div class="section-score">
            <div class="label">${s.section}</div>
            <div class="value" style="color: ${(s.correct/s.total) >= 0.75 ? 'var(--correct)' : (s.correct/s.total) >= 0.5 ? 'var(--warning)' : 'var(--danger)'}">${s.correct}/${s.total}</div>
          </div>
        `).join('')}
      </div>
      <div class="actions" style="justify-content: center;">
        <button class="btn btn-secondary" onclick="renderStart()">Back to Menu</button>
        <button class="btn btn-primary" onclick="startQuiz('${mode}')">Retry</button>
      </div>
    </div>
  `;
}

loadQuestions();
</script>
</body>
</html>
