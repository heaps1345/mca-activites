<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 2 Quiz</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 820px; margin: 40px auto; padding: 0 20px; }
  .q-block { background: #2A2A4E; border-radius: 10px; padding: 22px 26px; margin-bottom: 18px; border-left: 4px solid #E05C00; }
  .q-text  { font-size: 1.05rem; margin-bottom: 14px; line-height: 1.5; }
  .option  { display: block; padding: 10px 14px; margin: 6px 0; border-radius: 6px; cursor: pointer;
              background: #1A1A2E; border: 1px solid #444; transition: background .15s; }
  .option:hover { background: #3A3A5E; }
  .option.correct { background: #1a5c2a !important; border-color: #2ecc71 !important; color: #2ecc71; }
  .option.wrong   { background: #5c1a1a !important; border-color: #e74c3c !important; color: #e74c3c; }
  .explanation { display: none; margin-top: 10px; font-size: 0.9rem; color: #aaa; font-style: italic; }
  .nav { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 2</span>
  <h1>Practice Quiz</h1>
  <h2>Authentication & Access Management — 10 Questions</h2>
  <div id="quiz-area"></div>
  <div class="nav">
    <button class="btn btn-primary" onclick="submit()">Submit Answers</button>
    <button class="btn btn-secondary" style="margin-left:12px" onclick="reset()">Reset</button>
  </div>
  <div id="score-area"></div>
  <footer>MCA · SC-300 · Domain 2 · Authentication & Access Management</footer>
</div>
<script>
const qs = [{"q": "A CA policy requires MFA for all cloud apps. A user signs in to a legacy SMTP client without completing MFA. What is the most likely reason?", "opts": ["The user is excluded from the policy", "Legacy authentication clients bypass Conditional Access", "The SMTP app is not registered in Entra", "MFA is not supported for mail protocols"], "ans": 1, "exp": "Legacy auth protocols (SMTP, IMAP, POP3, basic auth) cannot prompt for MFA. CA cannot enforce MFA on them. 'Block Legacy Authentication' is a separate CA policy."}, {"q": "You want active SharePoint sessions terminated within minutes when a user is disabled, rather than waiting for token expiry. What feature provides this?", "opts": ["Token Lifetime Policy set to 10 minutes", "CA Sign-in Frequency set to 1 hour", "Continuous Access Evaluation (CAE)", "Revoke-AzureADUserAllRefreshToken PowerShell cmdlet"], "ans": 2, "exp": "CAE enables near-real-time session revocation. When a user is disabled, Exchange and SharePoint push an event and the client re-evaluates immediately \u2014 token rejected within seconds."}, {"q": "Which authentication method is phishing-resistant and recommended for high-privilege accounts?", "opts": ["SMS OTP", "Microsoft Authenticator push notification", "FIDO2 security key", "OATH hardware token"], "ans": 2, "exp": "FIDO2 keys use public-key cryptography bound to the specific website origin \u2014 a phishing site cannot capture the credential. SMS and push notifications are vulnerable to AiTM attacks."}, {"q": "Entra ID Protection detects a high-risk sign-in. Your policy requires password change for HIGH USER RISK. The user completes MFA but is NOT prompted to change password. Why?", "opts": ["Sign-in risk and user risk are different signals", "The user's risk was already remediated", "Password change only triggers for leaked credentials", "The policy requires admin approval first"], "ans": 0, "exp": "Sign-in risk (suspicious authentication) and user risk (account may be compromised) are separate signals. An anonymous IP raises sign-in risk only. User risk requires separate detections like leaked credentials."}, {"q": "Contoso users need to access your Teams shared channels without guest accounts in your tenant. What do you configure?", "opts": ["B2B Collaboration with automatic redemption", "Cross-Tenant Access Settings - Inbound B2B Direct Connect for Contoso", "External Collaboration Settings - allow all domains", "Cross-Tenant Synchronization from Contoso"], "ans": 1, "exp": "Teams shared channels use B2B Direct Connect. Configure Cross-Tenant Access Settings with inbound B2B Direct Connect trust for Contoso. No guest object is created."}, {"q": "What does a Conditional Access policy 'Report-only' mode do?", "opts": ["Applies the policy but doesn't block access", "Logs what WOULD have happened without enforcing the policy", "Emails the admin a report of policy matches", "Only applies to users in a pilot group"], "ans": 1, "exp": "Report-only mode evaluates the policy and logs the result in sign-in logs under 'Report-only' without enforcing grant or block controls. Safe way to test before going live."}, {"q": "You want to require compliant devices for access to all cloud apps but exclude the Azure portal for break-glass accounts. How do you achieve this?", "opts": ["Create two separate CA policies", "Add break-glass accounts to the Users exclusion in a single policy", "Use Named Locations to exclude the break-glass IP", "Configure a CA policy exception in PIM"], "ans": 1, "exp": "Break-glass accounts should be explicitly excluded from CA policies in the Users > Exclude section. This ensures they can always access the portal even if device compliance is broken."}, {"q": "Authentication Strengths in Conditional Access allow you to do what?", "opts": ["Set a minimum password complexity requirement", "Require a specific combination of authentication methods (e.g., FIDO2 or Windows Hello only)", "Block all authentication except from managed devices", "Set the maximum token lifetime for cloud apps"], "ans": 1, "exp": "Authentication Strengths let you specify WHICH authentication methods are acceptable for a policy \u2014 e.g., require phishing-resistant methods only (FIDO2, Windows Hello) for admin roles."}, {"q": "A user is in Scope for an MFA CA policy but reports they are never prompted. What should you investigate first?", "opts": ["Whether legacy auth is in use", "Whether the user has a per-user MFA exemption", "Whether the user's session has a persistent browser cookie", "Whether the app is excluded from the policy target resources"], "ans": 3, "exp": "If the application the user is accessing is excluded from the policy's Target resources, the policy never applies. Always verify the app is in scope before investigating other factors."}, {"q": "What is the difference between MFA registration policy in Entra ID Protection and MFA enforcement via Conditional Access?", "opts": ["They are identical \u2014 both block sign-in until MFA is registered", "ID Protection registration policy nudges users to register; CA MFA policy enforces MFA at sign-in", "CA policy manages registration; ID Protection manages enforcement", "ID Protection requires P2; CA MFA requires only P1 for both registration and enforcement"], "ans": 1, "exp": "ID Protection's MFA Registration Policy prompts users to register methods without blocking access (registration-focused). CA's MFA requirement blocks access at sign-in if MFA is not completed."}];
let answered = {};
function render() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = qs.map((q,qi) => `
    <div class="q-block">
      <div class="q-text"><strong>Q${qi+1}.</strong> ${q.q}</div>
      ${q.opts.map((o,oi) => `<label class="option" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" style="display:none" onchange="pick(${qi},${oi})"> ${o}
      </label>`).join('')}
      <div class="explanation" id="exp-${qi}">${q.exp}</div>
    </div>`).join('');
}
function pick(qi,oi) { answered[qi] = oi; }
function submit() {
  let score = 0;
  qs.forEach((q,qi) => {
    const chosen = answered[qi];
    q.opts.forEach((_,oi) => {
      const el = document.getElementById(`opt-${qi}-${oi}`);
      if(oi === q.ans) el.classList.add('correct');
      else if(oi === chosen && chosen !== q.ans) el.classList.add('wrong');
    });
    document.getElementById(`exp-${qi}`).style.display = 'block';
    if(chosen === q.ans) score++;
  });
  const pct = Math.round(score/qs.length*100);
  document.getElementById('score-area').innerHTML =
    `<div class="score-box">${score}/${qs.length} &nbsp;·&nbsp; ${pct}%<br>
     <small style="font-size:1rem;font-weight:400;color:#E8E8F0">${pct>=80?'✅ Pass territory':'📚 Keep studying'}</small></div>`;
}
function reset() { answered = {}; render(); document.getElementById('score-area').innerHTML=''; }
render();
</script>
</body>
</html>
