<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 2 Quiz</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 820px; margin: 40px auto; padding: 0 20px; }
  .q-block { background: #2A2A4E; border-radius: 10px; padding: 22px 26px; margin-bottom: 18px; border-left: 4px solid #E05C00; }
  .q-text  { font-size: 1.05rem; margin-bottom: 14px; line-height: 1.5; }
  .option  { display: block; padding: 10px 14px; margin: 6px 0; border-radius: 6px; cursor: pointer;
              background: #1A1A2E; border: 1px solid #444; transition: background .15s; }
  .option:hover { background: #3A3A5E; }
  .option.correct { background: #1a5c2a !important; border-color: #2ecc71 !important; color: #2ecc71; }
  .option.wrong   { background: #5c1a1a !important; border-color: #e74c3c !important; color: #e74c3c; }
  .explanation { display: none; margin-top: 10px; font-size: 0.9rem; color: #aaa; font-style: italic; }
  .nav { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 2</span>
  <h1>Practice Quiz</h1>
  <h2>Authentication & Access Management</h2>
  <div id="quiz-area"></div>
  <div class="nav">
    <button class="btn btn-primary" onclick="submit()">Submit Answers</button>
    <button class="btn btn-secondary" style="margin-left:12px" onclick="reset()">Reset</button>
  </div>
  <div id="score-area"></div>
  <footer>MCA · SC-300 · Domain 2 · Authentication & Access Management</footer>
</div>
<script>
const qs = [{"q": "A Conditional Access policy is configured to require MFA for all cloud apps. A user successfully signs in to a legacy SMTP client without completing MFA. What is the most likely reason?", "opts": ["The user is excluded from the policy", "Legacy authentication clients bypass Conditional Access", "The SMTP app is not registered in Entra", "MFA is not supported for mail protocols"], "ans": 1, "exp": "Legacy authentication protocols (SMTP, IMAP, POP3, basic auth) do not support modern authentication challenges \u2014 they cannot prompt for MFA. Conditional Access cannot enforce MFA on them. Block Legacy Authentication is a separate CA policy recommendation."}, {"q": "You want to ensure that when an Entra ID user account is disabled mid-session, their active SharePoint and Exchange sessions are terminated within minutes rather than when their access token expires. What feature provides this?", "opts": ["Token Lifetime Policy set to 10 minutes", "Conditional Access Sign-in Frequency set to 1 hour", "Continuous Access Evaluation (CAE)", "Revoke-AzureADUserAllRefreshToken PowerShell cmdlet"], "ans": 2, "exp": "CAE enables near-real-time session revocation. When a user is disabled, Exchange Online and SharePoint push an event and the client immediately attempts re-evaluation \u2014 token is rejected within seconds to minutes."}, {"q": "Which authentication method is considered phishing-resistant and recommended for high-privilege accounts?", "opts": ["SMS OTP", "Microsoft Authenticator push notification", "FIDO2 security key", "OATH hardware token"], "ans": 2, "exp": "FIDO2 keys use public-key cryptography bound to the specific website origin \u2014 a phishing site cannot capture the credential. SMS OTP and push notifications can be intercepted via real-time phishing (AiTM). OATH tokens are phishable by replaying the OTP."}, {"q": "Entra ID Protection detects a high-risk sign-in from an anonymous IP. Your policy is set to require password change for high user risk. The user completes MFA but is NOT prompted to change their password. What is the cause?", "opts": ["Sign-in risk and user risk are different signals \u2014 sign-in risk does not set user risk automatically", "The user's risk was already remediated", "Password change is only triggered by leaked credentials, not sign-in risk", "The policy requires admin approval first"], "ans": 0, "exp": "Sign-in risk (this specific authentication is suspicious) and user risk (the account may be compromised) are separate signals. An anonymous IP triggers sign-in risk. User risk (which drives password change requirement) requires separate detection like leaked credentials or confirmed compromise."}, {"q": "You need users at partner organization Contoso to access your Teams shared channels without creating guest accounts in your tenant. What should you configure?", "opts": ["B2B Collaboration with automatic redemption", "Cross-Tenant Access Settings > Inbound B2B Direct Connect", "External Collaboration Settings > allow all domains", "Cross-Tenant Synchronization from Contoso"], "ans": 1, "exp": "Teams shared channels use B2B Direct Connect \u2014 it requires configuring Cross-Tenant Access Settings with an inbound B2B Direct Connect trust for Contoso's tenant. No guest object is created in your directory."}];
let answered = {};
function render() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = qs.map((q,qi) => `
    <div class="q-block">
      <div class="q-text"><strong>Q${qi+1}.</strong> ${q.q}</div>
      ${q.opts.map((o,oi) => `<label class="option" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" style="display:none" onchange="pick(${qi},${oi})"> ${o}
      </label>`).join('')}
      <div class="explanation" id="exp-${qi}">${q.exp}</div>
    </div>`).join('');
}
function pick(qi,oi) { answered[qi] = oi; }
function submit() {
  let score = 0;
  qs.forEach((q,qi) => {
    const chosen = answered[qi];
    q.opts.forEach((_,oi) => {
      const el = document.getElementById(`opt-${qi}-${oi}`);
      if(oi === q.ans) el.classList.add('correct');
      else if(oi === chosen && chosen !== q.ans) el.classList.add('wrong');
    });
    document.getElementById(`exp-${qi}`).style.display = 'block';
    if(chosen === q.ans) score++;
  });
  const pct = Math.round(score/qs.length*100);
  document.getElementById('score-area').innerHTML =
    `<div class="score-box">${score}/${qs.length} &nbsp;·&nbsp; ${pct}%<br>
     <small style="font-size:1rem;font-weight:400;color:#E8E8F0">${pct>=80?'✅ Pass territory':'📚 Keep studying'}</small></div>`;
}
function reset() { answered = {}; render(); document.getElementById('score-area').innerHTML=''; }
render();
</script>
</body>
</html>
