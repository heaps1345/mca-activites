<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 4 Flash Cards</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 780px; margin: 40px auto; padding: 0 20px; }
  .progress { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
  .card-wrap { perspective: 1000px; width: 100%; height: 280px; cursor: pointer; margin-bottom: 24px; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .45s; border-radius: 12px; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px;
           display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; font-size: 1.15rem; line-height: 1.55; }
  .front { background: #2A2A4E; border: 2px solid #E05C00; color: #E8E8F0; }
  .back  { background: #E05C00; color: #fff; transform: rotateY(180deg); }
  .hint  { font-size: 0.8rem; opacity: .6; margin-top: 30px; }
  .nav   { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 4</span>
  <h1>Flash Cards</h1>
  <h2>Identity Governance</h2>
  <div class="progress" id="prog"></div>
  <div class="card-wrap" onclick="flip()">
    <div class="card" id="card">
      <div class="face front" id="front-text"></div>
      <div class="face back"  id="back-text"></div>
    </div>
  </div>
  <div class="nav">
    <button class="btn btn-secondary" onclick="prev()">← Prev</button>
    <button class="btn btn-primary"   onclick="flip()">Flip</button>
    <button class="btn btn-secondary" onclick="next()">Next →</button>
  </div>
  <div class="hint">Click the card or press Flip to reveal the answer</div>
  <footer>MCA · SC-300 · Domain 4 · Identity Governance</footer>
</div>
<script>
const cards = [{"q": "What are the five pillars of Entra ID Governance?", "a": "1. Access Reviews \u2014 periodic review of who has access\n2. Entitlement Management \u2014 access packages for governed request/approval\n3. Privileged Identity Management (PIM) \u2014 JIT privileged access\n4. Lifecycle Workflows \u2014 automate joiner/mover/leaver tasks\n5. Terms of Use \u2014 require acceptance before accessing resources"}, {"q": "What is PIM and what are the three role assignment states?", "a": "Privileged Identity Management enforces just-in-time privileged access. Three states:\n1. Eligible \u2014 user can activate when needed; requires approval / MFA\n2. Active \u2014 user has the role right now (time-limited or permanent)\n3. Expired \u2014 past the end date; no longer in effect"}, {"q": "What is an Access Package in Entitlement Management?", "a": "An access package bundles multiple resources (groups, apps, SharePoint sites) into a single requestable unit. Users request access through the My Access portal; approvers review; access expires automatically. Supports separation of duties and catalog delegation."}, {"q": "What is an Access Review and when is it required?", "a": "Access Reviews let owners periodically certify that users still need their current access. Required by compliance frameworks (ISO 27001, SOC 2, NIST). Can review: group memberships, app assignments, Entra roles, Azure roles. Reviewers can be owners, managers, or the users themselves."}, {"q": "What is Lifecycle Workflows?", "a": "Entra Lifecycle Workflows automate identity tasks triggered by HR events:\n\u2022 Joiner: provision account, send welcome email, add to groups before day 1\n\u2022 Mover: update access when role changes\n\u2022 Leaver: disable account, remove licenses, notify manager on last day\nReplaces custom Azure Logic Apps / scripts for common lifecycle tasks."}, {"q": "What is an Emergency Access Account (Break Glass)?", "a": "Cloud-only, non-federated accounts excluded from all Conditional Access policies and MFA requirements. Used when normal admin access is unavailable (IdP outage, MFA failure). Should be: Global Admins, have complex passwords stored physically in a safe, monitored for any sign-in, have at least two accounts."}, {"q": "What is Privileged Access Groups?", "a": "Privileged Access Groups (PAG) let you use PIM to make group membership eligible rather than permanent. Useful for groups used to assign Azure resource roles or app permissions. Members activate their group membership via PIM just-in-time, same as role activation."}, {"q": "What is the difference between Azure RBAC and Entra Roles?", "a": "Entra Roles control access to Entra admin plane (manage users, apps, tenants). Azure RBAC controls access to Azure data plane and management (VMs, storage, Key Vault). PIM manages both. They are separate systems with separate assignments \u2014 a Global Admin is not automatically an Azure Owner."}, {"q": "What is Entitlement Management Catalog?", "a": "A catalog is a container of resources and access packages. Enables delegation \u2014 a catalog owner can create and manage their own access packages without being a global admin. Resources must be added to a catalog before they can be included in an access package."}, {"q": "What is Conditional Access for Privileged Roles (PIM + CA)?", "a": "You can require specific authentication strength when activating a PIM role \u2014 e.g., require FIDO2 key or Windows Hello to activate Global Administrator. Configured in PIM role settings under 'Require Azure AD MFA' and linking to a CA authentication context. Stronger than a blanket MFA requirement."}];
let idx = 0;
function show() {
  const c = cards[idx];
  document.getElementById('front-text').textContent = c.q;
  document.getElementById('back-text').textContent  = c.a;
  document.getElementById('prog').textContent = `Card ${idx+1} of ${cards.length}`;
  document.getElementById('card').classList.remove('flipped');
}
function flip() { document.getElementById('card').classList.toggle('flipped'); }
function next() { idx = (idx+1) % cards.length; show(); }
function prev() { idx = (idx-1+cards.length) % cards.length; show(); }
show();
</script>
</body>
</html>
