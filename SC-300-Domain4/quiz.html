<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 4 Quiz</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 820px; margin: 40px auto; padding: 0 20px; }
  .q-block { background: #2A2A4E; border-radius: 10px; padding: 22px 26px; margin-bottom: 18px; border-left: 4px solid #E05C00; }
  .q-text  { font-size: 1.05rem; margin-bottom: 14px; line-height: 1.5; }
  .option  { display: block; padding: 10px 14px; margin: 6px 0; border-radius: 6px; cursor: pointer;
              background: #1A1A2E; border: 1px solid #444; transition: background .15s; }
  .option:hover { background: #3A3A5E; }
  .option.correct { background: #1a5c2a !important; border-color: #2ecc71 !important; color: #2ecc71; }
  .option.wrong   { background: #5c1a1a !important; border-color: #e74c3c !important; color: #e74c3c; }
  .explanation { display: none; margin-top: 10px; font-size: 0.9rem; color: #aaa; font-style: italic; }
  .nav { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 4</span>
  <h1>Practice Quiz</h1>
  <h2>Identity Governance — 10 Questions</h2>
  <div id="quiz-area"></div>
  <div class="nav">
    <button class="btn btn-primary" onclick="submit()">Submit Answers</button>
    <button class="btn btn-secondary" style="margin-left:12px" onclick="reset()">Reset</button>
  </div>
  <div id="score-area"></div>
  <footer>MCA · SC-300 · Domain 4 · Identity Governance</footer>
</div>
<script>
const qs = [{"q": "A user needs Global Admin access for one hour for an emergency change. They are Eligible in PIM. What must they do?", "opts": ["Ask an existing Global Admin to assign them permanently", "Activate the role in PIM \u2014 complete MFA, provide justification, and wait for approval if required", "Use the Azure portal with current permissions and escalate when blocked", "Submit a helpdesk ticket"], "ans": 1, "exp": "PIM Eligible roles require explicit activation. The user goes to PIM > My roles > Eligible > Activate, completes MFA and justification, and optionally waits for approval."}, {"q": "An Access Review is completed. The reviewer selects 'Deny' for a user. Auto-apply is enabled. What happens?", "opts": ["The user's account is disabled", "The user's access to the reviewed resource is removed", "The user receives an email to justify their access within 7 days", "Nothing \u2014 an admin must manually process results"], "ans": 1, "exp": "With Auto-apply enabled, a Deny decision removes the user from the reviewed resource (group, app, or role) at the end of the review period. The account itself is not disabled."}, {"q": "You want to automatically provision Entra accounts and send a welcome email on an employee's start date. Which feature should you use?", "opts": ["Entra Connect HR-driven provisioning", "Lifecycle Workflows - Joiner workflow", "Entitlement Management auto-assignment policy", "Power Automate with Entra connector"], "ans": 1, "exp": "Lifecycle Workflows (Joiner workflow) triggers on employeeHireDate, can create/enable accounts, generate TAPs, send welcome emails, and add users to groups before day one."}, {"q": "Which of the following best describes an Emergency Access (Break Glass) account?", "opts": ["A service account used for automated maintenance tasks", "A cloud-only Global Admin excluded from all CA and MFA policies, used only when normal admin access fails", "A PIM-eligible role that can be activated without MFA in emergencies", "A federated account with a shorter token lifetime for high-risk operations"], "ans": 1, "exp": "Break glass accounts are cloud-only, non-federated, explicitly excluded from CA and MFA, used only when the primary admin mechanism fails. Their sign-ins must be monitored with alerts."}, {"q": "A company wants self-service access requests to a bundle of resources (SharePoint + group + SaaS app) with manager approval and 90-day expiry. Which feature?", "opts": ["Dynamic groups with membership rules", "Entitlement Management - Access Packages", "Access Reviews with auto-remediation", "PIM for Groups"], "ans": 1, "exp": "Entitlement Management Access Packages bundle multiple resources, define approval policies, and set expiration. Users request via My Access portal, managers approve, access expires automatically."}, {"q": "What is the purpose of Entitlement Management's Connected Organizations feature?", "opts": ["To sync external users from partner tenants into your directory automatically", "To allow users from external organizations to request access packages via My Access portal", "To configure B2B Direct Connect with partner organizations", "To create federated identity providers for external users"], "ans": 1, "exp": "Connected Organizations allow external users (from other Entra tenants or social identity providers) to request access packages. You control which external orgs can request which packages."}, {"q": "PIM requires justification and approval for the Global Administrator role. An admin needs to activate it urgently but their manager (approver) is unavailable. What can be done?", "opts": ["The admin can bypass approval by providing a longer justification", "Another designated approver in the approval list can approve", "The admin can temporarily make themselves permanently Active if they are already eligible", "Emergency activation waives approval automatically after 30 minutes"], "ans": 1, "exp": "PIM approval can have multiple approvers. If the primary approver is unavailable, any other designated approver in the list can approve the activation. This is why multiple approvers should always be configured."}, {"q": "What does Privileged Access Groups in PIM enable that standard PIM for Entra Roles does not?", "opts": ["Time-limited assignment to Entra directory roles", "Just-in-time membership or ownership of a security group, which can then control access to non-Entra resources", "MFA enforcement at role activation", "Approval workflows for role activation"], "ans": 1, "exp": "PIM for Groups enables JIT membership of a security group. Since security groups can control Azure RBAC, on-prem app access, and other resources, this extends PIM's JIT model beyond Entra roles."}, {"q": "An Access Review is configured for all members of the 'Global Administrators' role. A reviewer marks a user as 'Don't know'. What happens at review end with Auto-apply enabled?", "opts": ["The user retains access (no decision = no change)", "The user's role assignment is removed (treated as Deny)", "The review flags the user for manual admin review", "The system automatically re-sends the review to a different reviewer"], "ans": 1, "exp": "When a reviewer selects 'Don't know' and the review setting is 'Remove access if reviewers don't respond or select don't know', the access is removed. Check your review's 'If reviewers don't respond' setting \u2014 default for privileged roles is to remove access."}, {"q": "What is the difference between 'Eligible' and 'Active' assignments in PIM?", "opts": ["Eligible assignments are permanent; Active assignments expire automatically", "Eligible assignments require activation steps (MFA, justification); Active assignments are immediately usable", "Active assignments can only be created by Global Admins; Eligible by any admin", "Eligible assignments apply to groups only; Active assignments apply to roles only"], "ans": 1, "exp": "Eligible: the user CAN get the role but must activate it via PIM (completing MFA, justification, and any approval). Active: the role is immediately usable without activation steps, for a time-bound or permanent period."}];
let answered = {};
function render() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = qs.map((q,qi) => `
    <div class="q-block">
      <div class="q-text"><strong>Q${qi+1}.</strong> ${q.q}</div>
      ${q.opts.map((o,oi) => `<label class="option" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" style="display:none" onchange="pick(${qi},${oi})"> ${o}
      </label>`).join('')}
      <div class="explanation" id="exp-${qi}">${q.exp}</div>
    </div>`).join('');
}
function pick(qi,oi) { answered[qi] = oi; }
function submit() {
  let score = 0;
  qs.forEach((q,qi) => {
    const chosen = answered[qi];
    q.opts.forEach((_,oi) => {
      const el = document.getElementById(`opt-${qi}-${oi}`);
      if(oi === q.ans) el.classList.add('correct');
      else if(oi === chosen && chosen !== q.ans) el.classList.add('wrong');
    });
    document.getElementById(`exp-${qi}`).style.display = 'block';
    if(chosen === q.ans) score++;
  });
  const pct = Math.round(score/qs.length*100);
  document.getElementById('score-area').innerHTML =
    `<div class="score-box">${score}/${qs.length} &nbsp;·&nbsp; ${pct}%<br>
     <small style="font-size:1rem;font-weight:400;color:#E8E8F0">${pct>=80?'✅ Pass territory':'📚 Keep studying'}</small></div>`;
}
function reset() { answered = {}; render(); document.getElementById('score-area').innerHTML=''; }
render();
</script>
</body>
</html>
