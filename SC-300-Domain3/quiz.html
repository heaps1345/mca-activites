<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 3 Quiz</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 820px; margin: 40px auto; padding: 0 20px; }
  .q-block { background: #2A2A4E; border-radius: 10px; padding: 22px 26px; margin-bottom: 18px; border-left: 4px solid #E05C00; }
  .q-text  { font-size: 1.05rem; margin-bottom: 14px; line-height: 1.5; }
  .option  { display: block; padding: 10px 14px; margin: 6px 0; border-radius: 6px; cursor: pointer;
              background: #1A1A2E; border: 1px solid #444; transition: background .15s; }
  .option:hover { background: #3A3A5E; }
  .option.correct { background: #1a5c2a !important; border-color: #2ecc71 !important; color: #2ecc71; }
  .option.wrong   { background: #5c1a1a !important; border-color: #e74c3c !important; color: #e74c3c; }
  .explanation { display: none; margin-top: 10px; font-size: 0.9rem; color: #aaa; font-style: italic; }
  .nav { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 3</span>
  <h1>Practice Quiz</h1>
  <h2>Workload Identities</h2>
  <div id="quiz-area"></div>
  <div class="nav">
    <button class="btn btn-primary" onclick="submit()">Submit Answers</button>
    <button class="btn btn-secondary" style="margin-left:12px" onclick="reset()">Reset</button>
  </div>
  <div id="score-area"></div>
  <footer>MCA · SC-300 · Domain 3 · Workload Identities</footer>
</div>
<script>
const qs = [{"q": "A web app running in Azure App Service needs to read secrets from Key Vault. Which identity approach requires NO credential management?", "opts": ["App Registration with client secret", "App Registration with certificate", "System-Assigned Managed Identity", "Service account with password stored in Key Vault"], "ans": 2, "exp": "System-Assigned Managed Identity is automatically created for the App Service, lifecycle-bound to it, and uses Entra's managed credential infrastructure \u2014 no secrets, no certificates, no rotation needed."}, {"q": "A GitHub Actions workflow needs to deploy resources to Azure. The security team requires NO long-lived secrets in GitHub. What is the correct solution?", "opts": ["Store an Azure service principal client secret as a GitHub Actions secret", "Use a managed identity in GitHub Actions", "Configure Workload Identity Federation between GitHub and Entra", "Use a short-lived client secret (1 day) rotated by a pipeline"], "ans": 2, "exp": "Workload Identity Federation allows GitHub Actions OIDC tokens to be exchanged for Entra access tokens without storing any Azure credentials. The federated credential is configured on the App Registration to trust GitHub's OIDC issuer."}, {"q": "An application needs to read all users' emails via Microsoft Graph with no user interaction. Which permission type and consent are required?", "opts": ["Delegated permission, user consent", "Delegated permission, admin consent", "Application permission, user consent", "Application permission, admin consent"], "ans": 3, "exp": "Mail.Read as an Application permission allows the app to read all users' mail with no signed-in user. Application permissions always require admin consent \u2014 a regular user cannot grant access to read all mailboxes."}, {"q": "What is the key difference between an App Registration and an Enterprise Application (Service Principal) in Entra?", "opts": ["App Registrations are for internal apps only; Enterprise Applications are for third-party SaaS", "An App Registration is the global definition; an Enterprise Application is the tenant-local instance created when the app is consented to", "Enterprise Applications support SAML; App Registrations support only OAuth 2.0", "App Registrations are deleted when the Enterprise Application is removed"], "ans": 1, "exp": "The App Registration (application object) is the authoritative definition and lives only in the home tenant. Every tenant that consents to the application gets a Service Principal (Enterprise Application) \u2014 a local instance representing that app in their directory."}, {"q": "A service principal was granted User.ReadWrite.All (Application permission). The security team wants to reduce blast radius. What should you recommend?", "opts": ["Switch to Delegated permission with a service account", "Remove the permission and grant User.Read.All only", "Use Attribute-Based Access Control instead", "Enable Conditional Access for the service principal"], "ans": 1, "exp": "Least privilege: if the app only needs to read users (not write), downgrade from User.ReadWrite.All to User.Read.All. This directly reduces the blast radius if the service principal is compromised."}];
let answered = {};
function render() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = qs.map((q,qi) => `
    <div class="q-block">
      <div class="q-text"><strong>Q${qi+1}.</strong> ${q.q}</div>
      ${q.opts.map((o,oi) => `<label class="option" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" style="display:none" onchange="pick(${qi},${oi})"> ${o}
      </label>`).join('')}
      <div class="explanation" id="exp-${qi}">${q.exp}</div>
    </div>`).join('');
}
function pick(qi,oi) { answered[qi] = oi; }
function submit() {
  let score = 0;
  qs.forEach((q,qi) => {
    const chosen = answered[qi];
    q.opts.forEach((_,oi) => {
      const el = document.getElementById(`opt-${qi}-${oi}`);
      if(oi === q.ans) el.classList.add('correct');
      else if(oi === chosen && chosen !== q.ans) el.classList.add('wrong');
    });
    document.getElementById(`exp-${qi}`).style.display = 'block';
    if(chosen === q.ans) score++;
  });
  const pct = Math.round(score/qs.length*100);
  document.getElementById('score-area').innerHTML =
    `<div class="score-box">${score}/${qs.length} &nbsp;·&nbsp; ${pct}%<br>
     <small style="font-size:1rem;font-weight:400;color:#E8E8F0">${pct>=80?'✅ Pass territory':'📚 Keep studying'}</small></div>`;
}
function reset() { answered = {}; render(); document.getElementById('score-area').innerHTML=''; }
render();
</script>
</body>
</html>
