<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 1 Flash Cards</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 780px; margin: 40px auto; padding: 0 20px; }
  .progress { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
  .card-wrap { perspective: 1000px; width: 100%; height: 280px; cursor: pointer; margin-bottom: 24px; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .45s; border-radius: 12px; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px;
           display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; font-size: 1.15rem; line-height: 1.55; }
  .front { background: #2A2A4E; border: 2px solid #E05C00; color: #E8E8F0; }
  .back  { background: #E05C00; color: #fff; transform: rotateY(180deg); }
  .hint  { font-size: 0.8rem; opacity: .6; margin-top: 30px; }
  .nav   { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 1</span>
  <h1>Flash Cards</h1>
  <h2>User Identities</h2>
  <div class="progress" id="prog"></div>
  <div class="card-wrap" onclick="flip()">
    <div class="card" id="card">
      <div class="face front" id="front-text"></div>
      <div class="face back"  id="back-text"></div>
    </div>
  </div>
  <div class="nav">
    <button class="btn btn-secondary" onclick="prev()">← Prev</button>
    <button class="btn btn-primary"   onclick="flip()">Flip</button>
    <button class="btn btn-secondary" onclick="next()">Next →</button>
  </div>
  <div class="hint">Click the card or press Flip to reveal the answer</div>
  <footer>MCA · SC-300 · Domain 1 · User Identities</footer>
</div>
<script>
const cards = [{"q": "What is the difference between a Member user and a Guest user in Entra ID?", "a": "Member users are internal employees with full directory read access. Guest users (B2B) are external collaborators with limited access, invited via email or direct link."}, {"q": "What are the three ways to create Entra ID users?", "a": "1. Direct creation in Entra admin center / PowerShell / Graph API\n2. Bulk import via CSV\n3. Sync from on-premises AD via Entra Connect"}, {"q": "What is External ID in Microsoft Entra?", "a": "External ID is the umbrella feature for managing identities outside your organization \u2014 covering B2B collaboration (partners/guests) and B2C (customer-facing apps with their own sign-in experiences)."}, {"q": "What is B2B Direct Connect vs B2B Collaboration?", "a": "B2B Collaboration creates a guest account in your tenant. B2B Direct Connect establishes a mutual trust between two tenants \u2014 users appear as external but no guest object is created; used for Teams shared channels."}, {"q": "What is Cross-Tenant Synchronization?", "a": "Cross-Tenant Sync automatically provisions and synchronizes users from one Entra tenant to another \u2014 typically used within a multi-tenant enterprise to allow collaboration as if users were members."}, {"q": "What is the 4 External ID Models framework?", "a": "Microsoft's four patterns for external access:\n1. B2B Collaboration (guests)\n2. B2B Direct Connect (trusted orgs, Teams)\n3. External ID for customers (B2C)\n4. Cross-tenant sync (multi-tenant orgs)"}, {"q": "What is the default user role in Entra ID and what can they do?", "a": "The 'User' built-in role \u2014 can read most directory objects, update their own profile, register applications (if enabled), create groups (if enabled). Cannot read other users' auth methods or manage directory settings."}, {"q": "How do you bulk-create users in Entra ID?", "a": "Download the CSV template from Entra admin center > Users > Bulk operations > Bulk create. Populate required fields (displayName, userPrincipalName, passwordProfile) and upload. Max 50,000 rows."}, {"q": "What is an Entra ID Custom Security Attribute?", "a": "Admin-defined attributes attached to Entra objects (users, service principals) to store business-specific data. Used for attribute-based access control (ABAC). Only Attribute Assignment Administrators can read/write them."}, {"q": "What licenses are required for External ID (B2B)?", "a": "B2B Collaboration is included in all Entra ID editions. The inviting tenant's license tier governs guest access to premium features (MFA, Conditional Access, Identity Protection). Guests do not consume a seat in the inviting tenant under the 1:5 ratio rule (up to Entra ID P1)."}];
let idx = 0;
function show() {
  const c = cards[idx];
  document.getElementById('front-text').textContent = c.q;
  document.getElementById('back-text').textContent  = c.a;
  document.getElementById('prog').textContent = `Card ${idx+1} of ${cards.length}`;
  document.getElementById('card').classList.remove('flipped');
}
function flip() { document.getElementById('card').classList.toggle('flipped'); }
function next() { idx = (idx+1) % cards.length; show(); }
function prev() { idx = (idx-1+cards.length) % cards.length; show(); }
show();
</script>
</body>
</html>
