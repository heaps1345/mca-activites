<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-300 Domain 1 Quiz</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #1A1A2E; color: #E8E8F0; min-height: 100vh; }
  h1 { color: #E05C00; font-size: 1.6rem; margin-bottom: 8px; }
  h2 { color: #E05C00; font-size: 1.1rem; margin-bottom: 16px; opacity: 0.85; }
  .badge { display: inline-block; background: #E05C00; color: #fff; font-size: 0.7rem;
           font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .btn { display: inline-block; padding: 10px 28px; border: none; border-radius: 6px; cursor: pointer;
         font-size: 1rem; font-weight: 600; transition: all .15s; }
  .btn-primary { background: #E05C00; color: #fff; }
  .btn-primary:hover { background: #c44f00; }
  .btn-secondary { background: #2A2A4E; color: #E8E8F0; border: 1px solid #444; }
  .btn-secondary:hover { background: #3A3A5E; }
  .score-box { background: #2A2A4E; border: 2px solid #E05C00; border-radius: 10px;
               padding: 20px 30px; text-align: center; font-size: 2rem; font-weight: 700; color: #E05C00; margin-top: 16px; }
  footer { margin-top: 40px; font-size: 0.75rem; opacity: 0.4; text-align: center; }

  .container { max-width: 820px; margin: 40px auto; padding: 0 20px; }
  .q-block { background: #2A2A4E; border-radius: 10px; padding: 22px 26px; margin-bottom: 18px; border-left: 4px solid #E05C00; }
  .q-text  { font-size: 1.05rem; margin-bottom: 14px; line-height: 1.5; }
  .option  { display: block; padding: 10px 14px; margin: 6px 0; border-radius: 6px; cursor: pointer;
              background: #1A1A2E; border: 1px solid #444; transition: background .15s; }
  .option:hover { background: #3A3A5E; }
  .option.correct { background: #1a5c2a !important; border-color: #2ecc71 !important; color: #2ecc71; }
  .option.wrong   { background: #5c1a1a !important; border-color: #e74c3c !important; color: #e74c3c; }
  .explanation { display: none; margin-top: 10px; font-size: 0.9rem; color: #aaa; font-style: italic; }
  .nav { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="container">
  <span class="badge">SC-300 · Domain 1</span>
  <h1>Practice Quiz</h1>
  <h2>User Identities</h2>
  <div id="quiz-area"></div>
  <div class="nav">
    <button class="btn btn-primary" onclick="submit()">Submit Answers</button>
    <button class="btn btn-secondary" style="margin-left:12px" onclick="reset()">Reset</button>
  </div>
  <div id="score-area"></div>
  <footer>MCA · SC-300 · Domain 1 · User Identities</footer>
</div>
<script>
const qs = [{"q": "A partner company's users need access to your internal SharePoint sites without creating full member accounts. Which External ID feature should you configure?", "opts": ["Cross-Tenant Synchronization", "B2B Collaboration (Guest Invite)", "B2B Direct Connect", "External ID for customers"], "ans": 1, "exp": "B2B Collaboration invites external users as guests \u2014 they get a guest account in your tenant and can access resources you share with them, without becoming members."}, {"q": "Your organization has three Entra tenants. You want internal employees from Tenant A to appear in Tenant B's directory as synced members (not guests) so they can be assigned to Teams and groups natively. What should you configure?", "opts": ["B2B Collaboration", "Entra Connect cloud sync between tenants", "Cross-Tenant Synchronization", "B2B Direct Connect with automatic user creation"], "ans": 2, "exp": "Cross-Tenant Synchronization (CTS) automatically provisions users from a source tenant into a target tenant as member-type objects. This is specifically designed for multi-tenant enterprise scenarios."}, {"q": "An administrator wants to add 500 new user accounts from an HR export. What is the most efficient method?", "opts": ["Microsoft Graph API with a PowerShell script", "Bulk create via CSV upload in Entra admin center", "Entra Connect sync from on-prem AD", "Invite each user individually via B2B"], "ans": 1, "exp": "Bulk create via the CSV template in Entra admin center (Users > Bulk operations) is the built-in method for creating large numbers of accounts from an export file without writing code."}, {"q": "Which license tier is required for an invited B2B guest to use Conditional Access policies applied by the inviting tenant?", "opts": ["Entra ID Free", "Entra ID P1", "Entra ID P2", "Microsoft 365 E3"], "ans": 1, "exp": "Entra ID P1 is required in the inviting tenant to apply Conditional Access to guest users. The guest does not need their own P1 license \u2014 the inviting organization's license covers them under the 1:5 ratio rule."}, {"q": "A user reports they cannot reset their own password. They have the Authentication Administrator role but say the SSPR link doesn't work. What is the most likely cause?", "opts": ["SSPR is only available to Global Admins", "SSPR is not enabled for the user's group", "The user has not registered any authentication methods", "Authentication Administrators are excluded from SSPR by design"], "ans": 1, "exp": "SSPR must be enabled (All users, or selected group) in the Entra admin center Password reset settings. If the user's group isn't included, the SSPR portal will not work for them regardless of their admin role."}];
let answered = {};
function render() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = qs.map((q,qi) => `
    <div class="q-block">
      <div class="q-text"><strong>Q${qi+1}.</strong> ${q.q}</div>
      ${q.opts.map((o,oi) => `<label class="option" id="opt-${qi}-${oi}">
        <input type="radio" name="q${qi}" value="${oi}" style="display:none" onchange="pick(${qi},${oi})"> ${o}
      </label>`).join('')}
      <div class="explanation" id="exp-${qi}">${q.exp}</div>
    </div>`).join('');
}
function pick(qi,oi) { answered[qi] = oi; }
function submit() {
  let score = 0;
  qs.forEach((q,qi) => {
    const chosen = answered[qi];
    q.opts.forEach((_,oi) => {
      const el = document.getElementById(`opt-${qi}-${oi}`);
      if(oi === q.ans) el.classList.add('correct');
      else if(oi === chosen && chosen !== q.ans) el.classList.add('wrong');
    });
    document.getElementById(`exp-${qi}`).style.display = 'block';
    if(chosen === q.ans) score++;
  });
  const pct = Math.round(score/qs.length*100);
  document.getElementById('score-area').innerHTML =
    `<div class="score-box">${score}/${qs.length} &nbsp;·&nbsp; ${pct}%<br>
     <small style="font-size:1rem;font-weight:400;color:#E8E8F0">${pct>=80?'✅ Pass territory':'📚 Keep studying'}</small></div>`;
}
function reset() { answered = {}; render(); document.getElementById('score-area').innerHTML=''; }
render();
</script>
</body>
</html>
